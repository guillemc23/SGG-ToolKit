[project]
name = "sgg-toolkit"
version = "0.1.0"
description = "SGG-ToolKit environment managed with uv"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "numpy==1.23.5",
    "scipy",
    "h5py",
    "ipython",
    "ipdb",
    "ninja",
    "yacs",
    "cython",
    "matplotlib",
    "tqdm",
    "opencv-python",
    "overrides",
    "shapely",
    "pandas",
    "scikit-learn",
    "pycocotools",
    "e2cnn",
    "terminaltables",
    "six",
    "addict",
    "yapf",
    "pyyaml",
    "openmim",
    "setuptools<70",
    "wheel",
    "packaging",
    "torch-geometric==2.3.1",
    "mmcv-full==1.6.0",
    "mmdet==2.26.0",
    "mmrotate",
    "apex",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
no-build-isolation-package = ["mmcv-full", "mmrotate", "apex", "torch-scatter", "torch-sparse"]

[tool.uv.sources]
mmrotate = { path = "mmrote_RS", editable = true }
apex = { path = "apex" }
